<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Catch global errors early and display them in the boot status overlay
window.onerror = function(msg, url, line, col, error) {
  var statusEl = document.getElementById('boot-status');
  if (statusEl) {
    statusEl.innerHTML = '<span style="color: #f85149; font-weight: bold;">Error: ' + msg + '</span><br><span style="font-size: 10px; color: #8b949e;">at ' + (url ? url.split('/').pop() : 'unknown') + ':' + line + ':' + col + '</span>';
  }
  return false;
};
window.onunhandledrejection = function(event) {
  var statusEl = document.getElementById('boot-status');
  if (statusEl) {
    statusEl.innerHTML = '<span style="color: #f85149; font-weight: bold;">Unhandled Promise: ' + event.reason + '</span>';
  }
};
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZMUX Terminal</title>
<!-- Load Vendored xterm.css strictly from local assets to avoid CDN dependency -->
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<style>
:root {
  --bg: #0d1117;
  --bg-input: #161b22;
  --text: #c9d1d9;
  --text-bright: #58a6ff;
  --text-dim: #484f58;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }
body {
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  flex-direction: column;
}

/* Top Bar */
#topbar {
  height: 40px;
  background: var(--bg-input);
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  padding: 0 12px;
  flex-shrink: 0;
}
#topbar .title {
  font-weight: 700;
  color: var(--green);
  font-size: 14px;
  letter-spacing: 0.05em;
}
#topbar .title::before { content: '> '; }
#status {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
}

/* Session tab strip */
#tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 8px 0 12px;
  height: 34px;
  background: var(--bg-input);
  border-bottom: 1px solid #30363d;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
#tabs::-webkit-scrollbar { height: 0; display: none; }
.tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-dim);
  background: #21262d;
  border: 1px solid #30363d;
  border-radius: 4px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}
.tab.active { color: var(--green); border-color: var(--green); background: #12261a; }
/* A dot marks a session that is running something while you are elsewhere. */
.tab .busy { width: 6px; height: 6px; border-radius: 50%; background: var(--yellow); }
.tab .close { color: var(--text-dim); font-weight: 700; padding: 0 2px; }
.tab .close:active { color: var(--red); }
#tab-new {
  color: var(--text-bright); background: transparent; border: 1px dashed #30363d;
  border-radius: 4px; padding: 4px 10px; font-size: 13px; cursor: pointer; flex-shrink: 0;
}
#status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
#status-dot.idle { background: var(--green); }
#status-dot.running { background: var(--yellow); animation: blink 0.6s infinite; }
#status-dot.failed { background: var(--red); }
#status-dot.stopped { background: var(--text-dim); }
@keyframes blink { 50% { opacity: 0.3; } }

/* Terminal Container */
#terminal-container {
  flex: 1;
  background: var(--bg);
  padding: 8px;
  overflow: hidden;
  position: relative;
}

/* xterm custom tweaks to match layout */
.xterm {
  height: 100%;
}
.xterm-viewport {
  background-color: var(--bg) !important;
}

/* Bottom toolbar — two rows of virtual keys */
#toolbar {
  background: var(--bg-input);
  border-top: 1px solid #30363d;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  flex-shrink: 0;
}
.key-row {
  display: flex;
  gap: 5px;
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.key-row::-webkit-scrollbar { height: 0; display: none; }

.tool-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: var(--text);
  padding: 8px 14px;
  font-family: var(--mono);
  font-size: 12px;
  border-radius: 4px;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.tool-btn:active { background: #30363d; }
.tool-btn.danger { color: var(--red); border-color: #f8514933; }
/* A latched modifier (tap CTRL, then tap a letter) must look obviously armed. */
.tool-btn.latched {
  background: var(--text-bright);
  border-color: var(--text-bright);
  color: #0d1117;
  font-weight: 700;
}
.tool-btn.danger:active { background: #f8514922; }

/* Boot screen */
#boot {
  position: fixed; inset: 0; background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 1000; transition: opacity 0.3s;
}
#boot.hide { opacity: 0; pointer-events: none; }
#boot .logo {
  font-size: 36px; font-weight: 900; color: var(--green);
  letter-spacing: 0.1em; margin-bottom: 20px;
  text-shadow: 0 0 20px rgba(63,185,80,0.5);
}
#boot .logo-img {
  width: 96px; height: 96px;
  border-radius: 22%;
  margin-bottom: 16px;
  box-shadow: 0 0 24px rgba(63,185,80,0.35);
}
#boot .status { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>

<div id="boot">
  <img class="logo-img" src="/static/logo.png" alt="ZMUX logo">
  <div class="logo">ZMUX</div>
  <div class="status" id="boot-status">Starting secure interactive terminal...</div>
</div>

<div id="topbar">
  <span class="title">ZMUX</span>
  <span id="status"><span id="status-dot" class="idle"></span><span id="status-text">connected</span></span>
</div>

<!-- Session tabs (populated from the backend's `sessions` messages) -->
<div id="tabs"></div>

<!-- Mount element for xterm.js -->
<div id="terminal-container"></div>

<!-- Virtual keys. Built from KEY_ROWS in JS so the layout is data, not markup. -->
<div id="toolbar"></div>

<!-- Load Vendored xterm.js strictly from local assets to avoid CDN dependency -->
<script src="/static/vendor/xterm/xterm.js"></script>
<script>
const AUTH_TOKEN = "{{ auth_token }}";
const WS_PORT = {{ ws_port }};

const bootScreen = document.getElementById('boot');
const bootStatus = document.getElementById('boot-status');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let ws = null;
let term = null;
let resizeTimeout = null;

// Reconnection state: retry automatically for a while, then surface a
// visible, tappable error instead of silently spinning forever.
let reconnectAttempts = 0;
let everConnected = false;
let manualRetryHandler = null;
const MAX_AUTO_RECONNECT = 10;
const RECONNECT_DELAY_MS = 1500;

// Initialize xterm.js
function initTerminal() {
  term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: "'JetBrains Mono', 'Fira Code', 'Courier New', monospace",
    lineHeight: 1.2,
    theme: {
      background: "#0d1117",
      foreground: "#c9d1d9",
      cursor: "#58a6ff",
      black: "#0d1117",
      red: "#f85149",
      green: "#3fb950",
      yellow: "#d29922",
      blue: "#58a6ff",
      magenta: "#bc8cff",
      cyan: "#39c5cf",
      white: "#e6edf3",
      brightBlack: "#484f58",
      brightRed: "#ff7b72",
      brightGreen: "#56d364",
      brightYellow: "#f0b72f",
      brightBlue: "#79c0ff",
      brightMagenta: "#d3b2ff",
      brightCyan: "#56d4dd",
      brightWhite: "#ffffff"
    }
  });

  term.open(document.getElementById('terminal-container'));
  term.focus();

  // Route soft-keyboard input through the modifier latch, so a latched CTRL
  // applies to the next typed character too (not just virtual-key taps).
  term.onData((data) => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    if (ctrlLatched && data.length === 1) { sendKeyInput(data); return; }
    ws.send(data);
  });
}

// Connect to secure WebSocket server (port passed dynamically by backend)
function getWsHost(attempt) {
  const hosts = [];
  if (window.location.hostname) hosts.push(window.location.hostname);
  if (window.location.hostname !== "127.0.0.1") hosts.push("127.0.0.1");
  if (window.location.hostname !== "localhost") hosts.push("localhost");
  if (hosts.length === 0) hosts.push("127.0.0.1");
  return hosts[attempt % hosts.length];
}

function connectWebSocket() {
  // Use candidate hosts to correctly connect across Android ROMs (IPv4 vs IPv6 loopback quirks)
  const wsHost = getWsHost(reconnectAttempts);
  const wsUrl = `ws://${wsHost}:${WS_PORT}/?token=${AUTH_TOKEN}`;

  try {
    ws = new WebSocket(wsUrl);
  } catch (e) {
    console.error("WebSocket constructor failed:", e);
    scheduleReconnect();
    return;
  }

  // Handle binary messages from Python server cleanly
  ws.binaryType = "blob";

  ws.onopen = () => {
    console.log("WebSocket connected to ZMUX PTY session");
    statusDot.className = "idle";
    statusText.textContent = "connected";
    reconnectAttempts = 0;
    everConnected = true;
    bootScreen.onclick = null;

    // Hide boot screen on first successful connection
    setTimeout(() => {
      bootScreen.classList.add('hide');
      setTimeout(() => { bootScreen.style.display = 'none'; }, 300);
      fitTerminal();
    }, 400);
  };

  ws.onmessage = (event) => {
    if (!term) return;
    if (event.data instanceof Blob) {
      // Binary frame: raw terminal output.
      event.data.arrayBuffer().then((buf) => {
        term.write(new Uint8Array(buf));
      });
    } else {
      // Text frame: a control message (session state), or plain output.
      if (handleControlMessage(event.data)) return;
      term.write(event.data);
    }
  };

  ws.onclose = () => {
    console.log("WebSocket closed");
    scheduleReconnect();
  };

  ws.onerror = (err) => {
    console.error("WebSocket error:", err);
    statusDot.className = "failed";
    statusText.textContent = "error";
  };
}

// Retry automatically for a while, then give the user an explicit,
// tappable failure state instead of an infinite silent spinner.
function scheduleReconnect() {
  reconnectAttempts++;
  if (reconnectAttempts <= MAX_AUTO_RECONNECT) {
    statusDot.className = "stopped";
    statusText.textContent = `reconnecting (${reconnectAttempts}/${MAX_AUTO_RECONNECT})`;
    if (!everConnected) {
      bootStatus.textContent = `Waiting for backend shell... (attempt ${reconnectAttempts}/${MAX_AUTO_RECONNECT})`;
    }
    setTimeout(connectWebSocket, RECONNECT_DELAY_MS);
    return;
  }

  statusDot.className = "failed";
  statusText.textContent = "connection failed — tap to retry";
  if (!everConnected) {
    bootStatus.innerHTML =
      '<span style="color:#f85149;font-weight:bold">Could not reach the terminal backend.</span>' +
      '<br><span style="font-size:11px;color:#8b949e">Tap anywhere to try again</span>';
  } else if (term) {
    term.write("\r\n\x1b[31m[connection lost — tap terminal to reconnect]\x1b[0m\r\n");
  }
  enableManualRetry();
}

function enableManualRetry() {
  const retry = () => {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    reconnectAttempts = 0;
    bootScreen.onclick = null;
    if (!everConnected) {
      bootStatus.textContent = "Reconnecting to secure backend shell...";
    }
    connectWebSocket();
    if (term) term.focus();
  };
  bootScreen.onclick = retry;
  manualRetryHandler = retry;
}

// Send raw characters/actions over WebSocket
function sendRaw(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(data);
    term.focus();
  }
}

/* ------------------------------------------------------------------ *
 * Session tabs
 *
 * The backend owns session state; the client only renders it and sends
 * intents. A `{"type":"sessions"}` text frame arrives on connect and after
 * every new/switch/close.
 * ------------------------------------------------------------------ */
function handleControlMessage(text) {
  if (!text || text[0] !== '{') return false;
  let msg;
  try { msg = JSON.parse(text); } catch (e) { return false; }
  if (msg.type !== 'sessions') return false;
  renderTabs(msg);
  return true;
}

function sendAction(payload) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(payload));
}

function renderTabs(state) {
  const bar = document.getElementById('tabs');
  bar.innerHTML = '';
  const list = state.sessions || [];

  list.forEach((session, index) => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (session.id === state.active ? ' active' : '');

    if (session.busy && session.id !== state.active) {
      const dot = document.createElement('span');
      dot.className = 'busy';
      tab.appendChild(dot);
    }

    const label = document.createElement('span');
    label.textContent = String(index + 1);
    label.addEventListener('click', () => sendAction({ action: 'session.switch', id: session.id }));
    tab.appendChild(label);

    // Only offer a close affordance when there is more than one session;
    // closing the last one just respawns an empty terminal.
    if (list.length > 1) {
      const close = document.createElement('span');
      close.className = 'close';
      close.textContent = '×';
      close.addEventListener('click', (e) => {
        e.stopPropagation();
        sendAction({ action: 'session.close', id: session.id });
      });
      tab.appendChild(close);
    }
    bar.appendChild(tab);
  });

  if (list.length < (state.max || 8)) {
    const add = document.createElement('button');
    add.id = 'tab-new';
    add.type = 'button';
    add.textContent = '+';
    add.title = 'New session';
    add.addEventListener('click', () => sendAction({ action: 'session.new' }));
    bar.appendChild(add);
  }
}

/* ------------------------------------------------------------------ *
 * Virtual keys
 *
 * Data-driven (cf. Termux's JSON extra-keys config) so the layout can
 * later come from a preference file instead of hardcoded markup.
 *
 *   label     text on the button
 *   send      literal string sent to the terminal
 *   modifier  'ctrl' — latches instead of sending (tap CTRL, then a key)
 *   repeat    auto-repeats while held (arrows, backspace)
 * ------------------------------------------------------------------ */
const KEY_ROWS = [
  [
    { label: 'ESC', send: '\x1b' },
    { label: 'CTRL', modifier: 'ctrl' },
    { label: 'Tab', send: '\t' },
    { label: '↑', send: '\x1b[A', repeat: true },
    { label: '↓', send: '\x1b[B', repeat: true },
    { label: '←', send: '\x1b[D', repeat: true },
    { label: '→', send: '\x1b[C', repeat: true },
    { label: 'Home', send: '\x1b[H' },
    { label: 'End', send: '\x1b[F' }
  ],
  [
    { label: '^C', send: '\x03', danger: true },
    { label: '^D', send: '\x04', danger: true },
    { label: '⌫', send: '\x7f', repeat: true },
    { label: '/', send: '/' },
    { label: '-', send: '-' },
    { label: '~', send: '~' },
    { label: '|', send: '|' },
    { label: '>', send: '>' },
    { label: '&', send: '&' },
    { label: '*', send: '*' },
    { label: '"', send: '"' },
    { label: "'", send: "'" }
  ]
];

const REPEAT_INITIAL_DELAY_MS = 400;
const REPEAT_INTERVAL_MS = 55;

let ctrlLatched = false;
let ctrlButton = null;

// Translate a printable character into its control code: Ctrl+C -> 0x03.
function toControlCode(text) {
  if (!text || text.length !== 1) return null;
  const upper = text.toUpperCase();
  const code = upper.charCodeAt(0);
  if (code >= 64 && code < 128) return String.fromCharCode(code & 0x1f);
  return null;
}

function setCtrlLatched(active) {
  ctrlLatched = active;
  if (ctrlButton) ctrlButton.classList.toggle('latched', active);
}

// Route terminal input through the latch so CTRL applies to the next key,
// whether it comes from a virtual key or the soft keyboard.
function sendKeyInput(text) {
  if (ctrlLatched) {
    const control = toControlCode(text);
    setCtrlLatched(false);
    if (control !== null) { sendRaw(control); return; }
  }
  sendRaw(text);
}

function buildVirtualKeys() {
  const toolbar = document.getElementById('toolbar');
  toolbar.innerHTML = '';
  KEY_ROWS.forEach((row) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'key-row';
    row.forEach((key) => {
      const btn = document.createElement('button');
      btn.className = 'tool-btn' + (key.danger ? ' danger' : '');
      btn.textContent = key.label;
      btn.type = 'button';

      if (key.modifier === 'ctrl') {
        ctrlButton = btn;
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          setCtrlLatched(!ctrlLatched);
          if (term) term.focus();
        });
      } else if (key.repeat) {
        attachRepeating(btn, key.send);
      } else {
        btn.addEventListener('click', (e) => { e.preventDefault(); sendKeyInput(key.send); });
      }
      rowEl.appendChild(btn);
    });
    toolbar.appendChild(rowEl);
  });
}

// Hold-to-repeat: one press, then a steady stream until release.
function attachRepeating(btn, payload) {
  let initialTimer = null;
  let intervalTimer = null;

  const stop = () => {
    clearTimeout(initialTimer); clearInterval(intervalTimer);
    initialTimer = intervalTimer = null;
  };
  const start = (e) => {
    e.preventDefault();
    sendKeyInput(payload);
    stop();
    initialTimer = setTimeout(() => {
      intervalTimer = setInterval(() => sendRaw(payload), REPEAT_INTERVAL_MS);
    }, REPEAT_INITIAL_DELAY_MS);
  };

  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', stop);
  btn.addEventListener('touchcancel', stop);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
}

// Dynamic fitting of columns/rows to available viewport size
function fitTerminal() {
  if (!term) return;

  const container = document.getElementById("terminal-container");
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Measure precisely using a temporary hidden character
  const charMeasure = document.createElement("span");
  charMeasure.style.fontFamily = term.options.fontFamily;
  charMeasure.style.fontSize = term.options.fontSize + "px";
  charMeasure.style.visibility = "hidden";
  charMeasure.style.position = "absolute";
  charMeasure.textContent = "A";
  document.body.appendChild(charMeasure);

  const rect = charMeasure.getBoundingClientRect();
  const charWidth = rect.width || 7.8;
  const charHeight = rect.height || 18;
  document.body.removeChild(charMeasure);

  // Subtract padding
  const cols = Math.floor((width - 16) / charWidth);
  const rows = Math.floor((height - 16) / charHeight);

  if (cols > 4 && rows > 2) {
    term.resize(cols, rows);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: "resize", cols: cols, rows: rows }));
    }
  }
}

// Boot sequence
function boot() {
  bootStatus.textContent = 'Initializing terminal UI...';
  initTerminal();
  buildVirtualKeys();

  bootStatus.textContent = 'Connecting to secure backend shell...';
  connectWebSocket();
}

// Handle window resizing and layout changes
window.addEventListener('resize', () => {
  if (resizeTimeout) clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(fitTerminal, 150);
});

// Force focus back to terminal on container click; if the connection failed
// permanently, a tap also triggers a manual reconnect.
document.getElementById('terminal-container').addEventListener('click', () => {
  if (term) term.focus();
  if (manualRetryHandler && (!ws || ws.readyState !== WebSocket.OPEN)) {
    manualRetryHandler();
  }
});

// Start application
boot();
</script>
</body>
</html>
