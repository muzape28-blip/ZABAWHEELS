<!DOCTYPE html>
<html lang="en">
<head>
<script>
// Catch global errors early and display them in the boot status overlay
window.onerror = function(msg, url, line, col, error) {
  var statusEl = document.getElementById('boot-status');
  if (statusEl) {
    statusEl.innerHTML = '<span style="color: #f85149; font-weight: bold;">Error: ' + msg + '</span><br><span style="font-size: 10px; color: #8b949e;">at ' + (url ? url.split('/').pop() : 'unknown') + ':' + line + ':' + col + '</span>';
  }
  return false;
};
window.onunhandledrejection = function(event) {
  var statusEl = document.getElementById('boot-status');
  if (statusEl) {
    statusEl.innerHTML = '<span style="color: #f85149; font-weight: bold;">Unhandled Promise: ' + event.reason + '</span>';
  }
};
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZMUX Terminal</title>
<!-- Load Vendored xterm.css strictly from local assets to avoid CDN dependency -->
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<style>
:root {
  --bg: #0d1117;
  --bg-input: #161b22;
  --text: #c9d1d9;
  --text-bright: #58a6ff;
  --text-dim: #484f58;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d29922;
  --mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); }
body {
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  flex-direction: column;
}

/* Top Bar */
#topbar {
  height: 40px;
  background: var(--bg-input);
  border-bottom: 1px solid #30363d;
  display: flex;
  align-items: center;
  padding: 0 12px;
  flex-shrink: 0;
}
#topbar .title {
  font-weight: 700;
  color: var(--green);
  font-size: 14px;
  letter-spacing: 0.05em;
}
#topbar .title::before { content: '> '; }
#status {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
}
#status-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
#status-dot.idle { background: var(--green); }
#status-dot.running { background: var(--yellow); animation: blink 0.6s infinite; }
#status-dot.failed { background: var(--red); }
#status-dot.stopped { background: var(--text-dim); }
@keyframes blink { 50% { opacity: 0.3; } }

/* Terminal Container */
#terminal-container {
  flex: 1;
  background: var(--bg);
  padding: 8px;
  overflow: hidden;
  position: relative;
}

/* xterm custom tweaks to match layout */
.xterm {
  height: 100%;
}
.xterm-viewport {
  background-color: var(--bg) !important;
}

/* Bottom toolbar */
#toolbar {
  background: var(--bg-input);
  border-top: 1px solid #30363d;
  padding: 8px;
  display: flex;
  gap: 6px;
  flex-shrink: 0;
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
#toolbar::-webkit-scrollbar { height: 4px; }
#toolbar::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

.tool-btn {
  background: #21262d;
  border: 1px solid #30363d;
  color: var(--text);
  padding: 8px 14px;
  font-family: var(--mono);
  font-size: 12px;
  border-radius: 4px;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.tool-btn:active { background: #30363d; }
.tool-btn.danger { color: var(--red); border-color: #f8514933; }
.tool-btn.danger:active { background: #f8514922; }

/* Boot screen */
#boot {
  position: fixed; inset: 0; background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 1000; transition: opacity 0.3s;
}
#boot.hide { opacity: 0; pointer-events: none; }
#boot .logo {
  font-size: 36px; font-weight: 900; color: var(--green);
  letter-spacing: 0.1em; margin-bottom: 20px;
  text-shadow: 0 0 20px rgba(63,185,80,0.5);
}
#boot .logo-img {
  width: 96px; height: 96px;
  border-radius: 22%;
  margin-bottom: 16px;
  box-shadow: 0 0 24px rgba(63,185,80,0.35);
}
#boot .status { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>

<div id="boot">
  <img class="logo-img" src="/static/logo.png" alt="ZMUX logo">
  <div class="logo">ZMUX</div>
  <div class="status" id="boot-status">Starting secure interactive terminal...</div>
</div>

<div id="topbar">
  <span class="title">ZMUX</span>
  <span id="status"><span id="status-dot" class="idle"></span><span id="status-text">connected</span></span>
</div>

<!-- Mount element for xterm.js -->
<div id="terminal-container"></div>

<div id="toolbar">
  <button class="tool-btn" onclick="sendRaw('\t')">Tab</button>
  <button class="tool-btn" onclick="sendRaw('\x1b[A')">↑</button>
  <button class="tool-btn" onclick="sendRaw('\x1b[B')">↓</button>
  <button class="tool-btn" onclick="sendRaw('\x1b[D')">←</button>
  <button class="tool-btn" onclick="sendRaw('\x1b[C')">→</button>
  <button class="tool-btn danger" onclick="sendRaw('\x03')">Ctrl+C</button>
  <button class="tool-btn danger" onclick="sendRaw('\x04')">Ctrl+D</button>
  <button class="tool-btn" onclick="sendRaw('\x1b')">Esc</button>
  <button class="tool-btn" onclick="sendRaw('/')">/</button>
  <button class="tool-btn" onclick="sendRaw('~')">~</button>
  <button class="tool-btn" onclick="sendRaw('|')">|</button>
  <button class="tool-btn" onclick="sendRaw('>')">&gt;</button>
  <button class="tool-btn" onclick="sendRaw('&')">&amp;</button>
</div>

<!-- Load Vendored xterm.js strictly from local assets to avoid CDN dependency -->
<script src="/static/vendor/xterm/xterm.js"></script>
<script>
const AUTH_TOKEN = "{{ auth_token }}";
const WS_PORT = {{ ws_port }};

const bootScreen = document.getElementById('boot');
const bootStatus = document.getElementById('boot-status');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let ws = null;
let term = null;
let resizeTimeout = null;

// Reconnection state: retry automatically for a while, then surface a
// visible, tappable error instead of silently spinning forever.
let reconnectAttempts = 0;
let everConnected = false;
let manualRetryHandler = null;
const MAX_AUTO_RECONNECT = 10;
const RECONNECT_DELAY_MS = 1500;

// Initialize xterm.js
function initTerminal() {
  term = new Terminal({
    cursorBlink: true,
    fontSize: 13,
    fontFamily: "'JetBrains Mono', 'Fira Code', 'Courier New', monospace",
    lineHeight: 1.2,
    theme: {
      background: "#0d1117",
      foreground: "#c9d1d9",
      cursor: "#58a6ff",
      black: "#0d1117",
      red: "#f85149",
      green: "#3fb950",
      yellow: "#d29922",
      blue: "#58a6ff",
      magenta: "#bc8cff",
      cyan: "#39c5cf",
      white: "#e6edf3",
      brightBlack: "#484f58",
      brightRed: "#ff7b72",
      brightGreen: "#56d364",
      brightYellow: "#f0b72f",
      brightBlue: "#79c0ff",
      brightMagenta: "#d3b2ff",
      brightCyan: "#56d4dd",
      brightWhite: "#ffffff"
    }
  });

  term.open(document.getElementById('terminal-container'));
  term.focus();

  // Route user keyboard input to PTY WebSocket
  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(data);
    }
  });
}

// Connect to secure WebSocket server (port passed dynamically by backend)
function getWsHost(attempt) {
  const hosts = [];
  if (window.location.hostname) hosts.push(window.location.hostname);
  if (window.location.hostname !== "127.0.0.1") hosts.push("127.0.0.1");
  if (window.location.hostname !== "localhost") hosts.push("localhost");
  if (hosts.length === 0) hosts.push("127.0.0.1");
  return hosts[attempt % hosts.length];
}

function connectWebSocket() {
  // Use candidate hosts to correctly connect across Android ROMs (IPv4 vs IPv6 loopback quirks)
  const wsHost = getWsHost(reconnectAttempts);
  const wsUrl = `ws://${wsHost}:${WS_PORT}/?token=${AUTH_TOKEN}`;

  try {
    ws = new WebSocket(wsUrl);
  } catch (e) {
    console.error("WebSocket constructor failed:", e);
    scheduleReconnect();
    return;
  }

  // Handle binary messages from Python server cleanly
  ws.binaryType = "blob";

  ws.onopen = () => {
    console.log("WebSocket connected to ZMUX PTY session");
    statusDot.className = "idle";
    statusText.textContent = "connected";
    reconnectAttempts = 0;
    everConnected = true;
    bootScreen.onclick = null;

    // Hide boot screen on first successful connection
    setTimeout(() => {
      bootScreen.classList.add('hide');
      setTimeout(() => { bootScreen.style.display = 'none'; }, 300);
      fitTerminal();
    }, 400);
  };

  ws.onmessage = (event) => {
    if (!term) return;
    if (event.data instanceof Blob) {
      // Decode raw bytes to term
      event.data.arrayBuffer().then((buf) => {
        term.write(new Uint8Array(buf));
      });
    } else {
      term.write(event.data);
    }
  };

  ws.onclose = () => {
    console.log("WebSocket closed");
    scheduleReconnect();
  };

  ws.onerror = (err) => {
    console.error("WebSocket error:", err);
    statusDot.className = "failed";
    statusText.textContent = "error";
  };
}

// Retry automatically for a while, then give the user an explicit,
// tappable failure state instead of an infinite silent spinner.
function scheduleReconnect() {
  reconnectAttempts++;
  if (reconnectAttempts <= MAX_AUTO_RECONNECT) {
    statusDot.className = "stopped";
    statusText.textContent = `reconnecting (${reconnectAttempts}/${MAX_AUTO_RECONNECT})`;
    if (!everConnected) {
      bootStatus.textContent = `Waiting for backend shell... (attempt ${reconnectAttempts}/${MAX_AUTO_RECONNECT})`;
    }
    setTimeout(connectWebSocket, RECONNECT_DELAY_MS);
    return;
  }

  statusDot.className = "failed";
  statusText.textContent = "connection failed — tap to retry";
  if (!everConnected) {
    bootStatus.innerHTML =
      '<span style="color:#f85149;font-weight:bold">Could not reach the terminal backend.</span>' +
      '<br><span style="font-size:11px;color:#8b949e">Tap anywhere to try again</span>';
  } else if (term) {
    term.write("\r\n\x1b[31m[connection lost — tap terminal to reconnect]\x1b[0m\r\n");
  }
  enableManualRetry();
}

function enableManualRetry() {
  const retry = () => {
    if (ws && ws.readyState === WebSocket.OPEN) return;
    reconnectAttempts = 0;
    bootScreen.onclick = null;
    if (!everConnected) {
      bootStatus.textContent = "Reconnecting to secure backend shell...";
    }
    connectWebSocket();
    if (term) term.focus();
  };
  bootScreen.onclick = retry;
  manualRetryHandler = retry;
}

// Send raw characters/actions over WebSocket
function sendRaw(data) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(data);
    term.focus();
  }
}

// Dynamic fitting of columns/rows to available viewport size
function fitTerminal() {
  if (!term) return;

  const container = document.getElementById("terminal-container");
  const width = container.clientWidth;
  const height = container.clientHeight;

  // Measure precisely using a temporary hidden character
  const charMeasure = document.createElement("span");
  charMeasure.style.fontFamily = term.options.fontFamily;
  charMeasure.style.fontSize = term.options.fontSize + "px";
  charMeasure.style.visibility = "hidden";
  charMeasure.style.position = "absolute";
  charMeasure.textContent = "A";
  document.body.appendChild(charMeasure);

  const rect = charMeasure.getBoundingClientRect();
  const charWidth = rect.width || 7.8;
  const charHeight = rect.height || 18;
  document.body.removeChild(charMeasure);

  // Subtract padding
  const cols = Math.floor((width - 16) / charWidth);
  const rows = Math.floor((height - 16) / charHeight);

  if (cols > 4 && rows > 2) {
    term.resize(cols, rows);
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ action: "resize", cols: cols, rows: rows }));
    }
  }
}

// Boot sequence
function boot() {
  bootStatus.textContent = 'Initializing terminal UI...';
  initTerminal();

  bootStatus.textContent = 'Connecting to secure backend shell...';
  connectWebSocket();
}

// Handle window resizing and layout changes
window.addEventListener('resize', () => {
  if (resizeTimeout) clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(fitTerminal, 150);
});

// Force focus back to terminal on container click; if the connection failed
// permanently, a tap also triggers a manual reconnect.
document.getElementById('terminal-container').addEventListener('click', () => {
  if (term) term.focus();
  if (manualRetryHandler && (!ws || ws.readyState !== WebSocket.OPEN)) {
    manualRetryHandler();
  }
});

// Start application
boot();
</script>
</body>
</html>
