[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zmux"
version = "1.0.0"
description = "ZMUX — Android Terminal for Python"
requires-python = ">=3.10"
dependencies = [
    "flask>=2.3",
    "waitress>=2.1",
    "packaging>=23.0",
    "certifi>=2023.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zmux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
