# =============================================================================
# zaba-native-smoke — Native feasibility spike package
# =============================================================================
# This is the FIRST native package for ZABAWHEELS.
# Purpose: prove that native extension loading works on Zabacode/Android.
#
# API minimal:
#   import zaba_native_smoke
#   assert zaba_native_smoke.add(20, 22) == 42
#   assert zaba_native_smoke.runtime_info()["abi"] == "armeabi-v7a"

package: zaba-native-smoke
version: 0.1.0
upstream_url: https://github.com/muzape28-blip/ZABAWHEELS/tree/main/packages/zaba-native-smoke
upstream_license: AGPL-3.0

# Source (local — this package lives in ZABAWHEELS itself)
source_url: local
source_sha256: 292e1aab6c91a6a6be3c3b51596a77775ba9d8c437ea00cc2aeebc1bc50e43bd

# Build
build_system: setuptools
native: true
cython: true
fortran: false
cmake: false

# Native dependencies — minimal, no external dependencies
native_dependencies: []
required_shared_libs:
  - libc.so
  - libm.so
  - libpython3.so

# Python dependencies
python_dependencies:
  - setuptools
  - cython
runtime_dependencies: []

# Compatibility — will be filled after M1 runtime fingerprint
target_runtime_id: zmux-py314-api26-p4a5c192d7b7308-r1
target_abis:
  - armeabi-v7a
  - arm64-v8a
min_android_api: 26
max_android_api: null

# Build configuration
build_flags:
  CFLAGS: "-O2"
patches: []
extra_build_args: []

# Smoke test
smoke_test: |
  import zaba_native_smoke
  assert zaba_native_smoke.add(20, 22) == 42
  info = zaba_native_smoke.runtime_info()
  assert info["abi"] in ("armeabi-v7a", "arm64-v8a")
  assert info["platform"] != ""
  assert info["pointer_bits"] in (32, 64)

# Status
status: recipe-ready

# Metadata
recipe_author: muzape28
recipe_created: "2026-07-29"
recipe_updated: "2026-07-29"
notes: "First native package — feasibility spike for M2 gate. No external dependencies. Must prove .so loading works on Android ARMv7."
