name: Build Package Wheel

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name (e.g. zaba-native-smoke)"
        required: true
        type: string
      version:
        description: "Package version (e.g. 0.1.0)"
        required: true
        type: string
      abi:
        description: "Target ABI"
        required: true
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - experimental
          - candidate

permissions:
  contents: read

concurrency:
  group: build-package-${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}
  cancel-in-progress: false

env:
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  P4A_COMMIT: 5c192d7b7308487c2d3e3fcae63deba3131e7cb2
  SOURCE_DATE_EPOCH: "1785283200"

jobs:
  build-wheel:
    name: Build ${{ inputs.package }} ${{ inputs.version }} (${{ inputs.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: write  # Publishes releases and pushes the generated index.
    env:
      PACKAGE_NAME: ${{ inputs.package }}
      PACKAGE_VERSION: ${{ inputs.version }}
      PACKAGE_ABI: ${{ inputs.abi }}
      PACKAGE_CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements.lock

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip tar curl autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake ninja-build
          python -m pip install --upgrade pip==23.2.1
          python -m pip install buildozer==1.5.0 Cython==0.29.33 setuptools==68.2.2 wheel==0.41.2 PyYAML==6.0.3 jsonschema==4.26.0

      - name: Validate request, recipes, and source locks
        run: |
          python scripts/validate_recipes.py --all
          python scripts/verify_source_lock.py
          python scripts/build.py \
            --package "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --abi "$PACKAGE_ABI" \
            --channel "$PACKAGE_CHANNEL" \
            --dry-run

      - name: Verify pinned runtime contract
        working-directory: app
        run: |
          grep -q "p4a.commit = $P4A_COMMIT" buildozer.spec
          grep -q '^title = ZMUX$' buildozer.spec
          grep -q '^package.name = zmux$' buildozer.spec
          grep -q '^android.archs = armeabi-v7a, arm64-v8a$' buildozer.spec

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          accept-android-sdk-licenses: true

      - name: Make SDK manager available to Buildozer
        run: |
          CMDLINE_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d -print -quit)
          test -n "$CMDLINE_TOOLS_DIR"
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$CMDLINE_TOOLS_DIR/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$CMDLINE_TOOLS_DIR/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager" || true
          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache buildozer build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.buildozer/android/platform
            app/.buildozer/android/platform
          key: ${{ runner.os }}-zmux-p4a-${{ hashFiles('app/buildozer.spec', 'toolchain/runtime-lock.json') }}
          restore-keys: ${{ runner.os }}-zmux-p4a-

      - name: Prepare Python distribution via Buildozer
        working-directory: app
        run: buildozer -v android debug

      - name: Install package compiler version
        run: python -m pip install --upgrade Cython==3.2.9

      - name: Cross-compile package wheel
        run: |
          python scripts/build.py \
            --package "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --abi "$PACKAGE_ABI" \
            --channel "$PACKAGE_CHANNEL"

      - name: Verify wheel artifact exists
        id: verify
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -type f -print -quit)
          test -n "$WHEEL" || { echo "No wheel produced"; exit 1; }
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          sha256sum "$WHEEL"
          echo "Wheel verified: $(basename "$WHEEL")"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Generate package manifest and merged index
        env:
          WHEEL: ${{ steps.verify.outputs.wheel }}
        run: |
          RUNTIME_ID=$(python -c "import json; print(json.load(open('toolchain/runtime-lock.json'))['runtime_id'])")
          FILENAME=$(basename "$WHEEL")
          TAG="$PACKAGE_NAME-$PACKAGE_VERSION-$PACKAGE_ABI"
          ARTIFACT_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$FILENAME"
          MANIFEST="index/$PACKAGE_CHANNEL/$PACKAGE_NAME-$PACKAGE_VERSION-$PACKAGE_ABI.json"

          python scripts/generate_manifest.py \
            --package "$PACKAGE_NAME" \
            --version "$PACKAGE_VERSION" \
            --runtime-id "$RUNTIME_ID" \
            --abi "$PACKAGE_ABI" \
            --channel "$PACKAGE_CHANNEL" \
            --wheel "$WHEEL" \
            --artifact-url "$ARTIFACT_URL" \
            --build-passed \
            --elf-inspected \
            --output "$MANIFEST"

          python scripts/generate_index.py --output index/ --channel all

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHEEL: ${{ steps.verify.outputs.wheel }}
        run: |
          TAG="$PACKAGE_NAME-$PACKAGE_VERSION-$PACKAGE_ABI"
          SHA256=$(sha256sum "$WHEEL" | cut -d' ' -f1)
          RUNTIME_ID=$(python -c "import json; print(json.load(open('toolchain/runtime-lock.json'))['runtime_id'])")
          TITLE="Build $PACKAGE_NAME $PACKAGE_VERSION ($PACKAGE_ABI)"
          NOTES=$(printf '%s\n' \
            "Package: $PACKAGE_NAME $PACKAGE_VERSION" \
            "ABI: $PACKAGE_ABI" \
            "Channel: $PACKAGE_CHANNEL" \
            "SHA-256: $SHA256" \
            "Runtime: $RUNTIME_ID" \
            "" \
            "Built by the ZABAWHEELS CI pipeline.")

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$WHEEL" --clobber
          else
            gh release create "$TAG" "$WHEEL" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi

      - name: Commit index update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index/
          if git diff --cached --quiet; then
            echo "Index already up to date"
            exit 0
          fi
          git commit -m "Update index: $PACKAGE_NAME $PACKAGE_VERSION ($PACKAGE_ABI)"
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
