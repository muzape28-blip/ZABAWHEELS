name: Build ZMUX APK

on:
  push:
    branches: [main, arena/019fab2f-zabawheels, arena/019faae9-zabawheels]
    paths:
      - "app/**"
      - "toolchain/runtime-lock.json"
      - ".github/workflows/build-zmux-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "toolchain/runtime-lock.json"
      - ".github/workflows/build-zmux-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: zmux-apk-${{ github.ref }}
  cancel-in-progress: true