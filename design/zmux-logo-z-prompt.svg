<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ZMUX Z prompt logo</title>
  <desc id="desc">Minimal neon green Z greater-than underscore terminal prompt on a dark square.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b17"/>
      <stop offset="1" stop-color="#070b09"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="34" y="34" width="956" height="956" rx="192" fill="none" stroke="#1d3527" stroke-width="12"/>
  <g fill="none" stroke="#52e878" stroke-width="92" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Z -->
    <path d="M244 296H498L274 650H518"/>
    <!-- > -->
    <path d="M594 385L748 512L594 639"/>
    <!-- _ -->
    <path d="M757 697H853"/>
  </g>
</svg>
