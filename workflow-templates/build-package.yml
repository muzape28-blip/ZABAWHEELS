name: Build Package Wheel

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package name (e.g. zaba-native-smoke)"
        required: true
        type: string
      version:
        description: "Package version (e.g. 0.1.0)"
        required: true
        type: string
      abi:
        description: "Target ABI"
        required: true
        type: choice
        options:
          - armeabi-v7a
          - arm64-v8a
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - experimental
          - candidate

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  P4A_COMMIT: 5c192d7b7308487c2d3e3fcae63deba3131e7cb2
  SOURCE_DATE_EPOCH: "1785283200"

jobs:
  build-wheel:
    name: Build ${{ inputs.package }} ${{ inputs.version }} (${{ inputs.abi }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements.lock

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip tar curl autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake ninja-build
          python -m pip install --upgrade pip==23.2.1
          python -m pip install buildozer==1.5.0 Cython==0.29.33 setuptools==68.2.2 wheel==0.41.2 pyyaml

      - name: Verify pinned runtime contract
        working-directory: app
        run: |
          grep -q "p4a.commit = $P4A_COMMIT" buildozer.spec
          grep -q '^title = ZMUX$' buildozer.spec
          grep -q '^package.name = zmux$' buildozer.spec

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          accept-android-sdk-licenses: true

      - name: Make SDK manager available to Buildozer
        run: |
          CMDLINE_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | head -n 1)
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$CMDLINE_TOOLS_DIR/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$CMDLINE_TOOLS_DIR/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager" || true
          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Cache buildozer build output
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.buildozer/android/platform
            app/.buildozer/android/platform
          key: ${{ runner.os }}-zmux-p4a-${{ hashFiles('app/buildozer.spec', 'toolchain/runtime-lock.json') }}
          restore-keys: ${{ runner.os }}-zmux-p4a-

      - name: Prepare Python distribution via buildozer
        working-directory: app
        run: |
          # Build the APK to prepare the Python distribution.
          # This is the expensive step (30-60 min first run) but it's cached.
          # Subsequent runs reuse the cache and skip this quickly.
          buildozer -v android debug 2>&1 | tail -5
          echo "Buildozer build complete (or cached)"

      - name: Validate recipe and structure
        run: |
          python3 scripts/validate_recipes.py --all
          python3 scripts/verify_source_lock.py

      - name: Cross-compile package wheel
        run: |
          python3 scripts/build.py \
            --package ${{ inputs.package }} \
            --version ${{ inputs.version }} \
            --abi ${{ inputs.abi }} \
            --channel ${{ inputs.channel }}

      - name: Verify wheel artifact exists
        id: verify
        run: |
          WHEEL=$(find dist -maxdepth 1 -name '*.whl' -type f | head -n 1)
          test -n "$WHEEL" || { echo "❌ No wheel produced"; exit 1; }
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "wheel_name=$(basename $WHEEL)" >> "$GITHUB_OUTPUT"
          sha256sum "$WHEEL"
          echo "✓ Wheel verified: $(basename $WHEEL)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Generate and update index
        run: |
          WHEEL="${{ steps.verify.outputs.wheel }}"
          SHA256=$(sha256sum "$WHEEL" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$WHEEL")
          FILENAME=$(basename "$WHEEL")

          # Read runtime lock
          RUNTIME_ID=$(python3 -c "import json; print(json.load(open('toolchain/runtime-lock.json'))['runtime_id'])")

          # Generate manifest for this wheel
          python3 scripts/generate_manifest.py \
            --package ${{ inputs.package }} \
            --version ${{ inputs.version }} \
            --runtime-id "$RUNTIME_ID" \
            --abi ${{ inputs.abi }} \
            --channel ${{ inputs.channel }} \
            --wheel "$WHEEL" \
            --output "index/${{ inputs.channel }}/${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}.json"

          # Update ABI-specific index
          python3 -c "
          import json
          from pathlib import Path

          abi_json = Path('index/v1/runtimes/${RUNTIME_ID}/${{ inputs.abi }}.json')
          abi_json.parent.mkdir(parents=True, exist_ok=True)

          # Load existing or create new
          if abi_json.exists():
              data = json.loads(abi_json.read_text())
          else:
              data = {'schema_version': 1, 'runtime_id': '${RUNTIME_ID}', 'abi': '${{ inputs.abi }}', 'packages': {}}

          # Load manifest
          manifest_path = Path('index/${{ inputs.channel }}/${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}.json')
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}

          # Add package to ABI index with full artifact info
          data['packages']['${{ inputs.package }}'] = {
              'name': '${{ inputs.package }}',
              'version': '${{ inputs.version }}',
              'runtime_id': '${RUNTIME_ID}',
              'abi': '${{ inputs.abi }}',
              'channel': '${{ inputs.channel }}',
              'artifact': {
                  'filename': '${FILENAME}',
                  'url': 'https://github.com/${{ github.repository }}/releases/download/${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}/${FILENAME}',
                  'size': ${SIZE},
                  'sha256': '${SHA256}',
              },
              'native': manifest.get('native', {'has_extensions': True, 'needed_libraries': []}),
              'dependencies': manifest.get('dependencies', []),
              'source': manifest.get('source', {}),
              'verification': manifest.get('verification', {
                  'build_passed': True,
                  'elf_inspected': True,
                  'device_tested': False,
                  'tested_devices': [],
              }),
          }

          abi_json.write_text(json.dumps(data, indent=2) + '\n')
          print(f'  ✓ Updated {abi_json}')
          "

          # Update packages.json
          python3 -c "
          import json
          from pathlib import Path

          pkg_json = Path('index/v1/runtimes/${RUNTIME_ID}/packages.json')
          if pkg_json.exists():
              data = json.loads(pkg_json.read_text())
          else:
              data = {'schema_version': 1, 'runtime_id': '${RUNTIME_ID}', 'packages': {}}

          data['packages']['${{ inputs.package }}'] = {
              'name': '${{ inputs.package }}',
              'version': '${{ inputs.version }}',
              'channel': '${{ inputs.channel }}',
              'native': True,
              'status': 'built',
          }

          pkg_json.write_text(json.dumps(data, indent=2) + '\n')
          print(f'  ✓ Updated {pkg_json}')
          "

          # Regenerate full index
          python3 scripts/generate_index.py --output index/

          echo "✓ Index updated"

      - name: Create GitHub Release and upload wheel
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.package }}-${{ inputs.version }}-${{ inputs.abi }}"
          WHEEL="${{ steps.verify.outputs.wheel }}"
          SHA256=$(sha256sum "$WHEEL" | cut -d' ' -f1)

          # Create release (or update if exists)
          gh release create "$TAG" "$WHEEL" \
            --title "Build ${{ inputs.package }} ${{ inputs.version }} (${{ inputs.abi }})" \
            --notes "## Cross-compiled wheel for ZMUX

          - **Package:** ${{ inputs.package }} ${{ inputs.version }}
          - **ABI:** ${{ inputs.abi }}
          - **Channel:** ${{ inputs.channel }}
          - **SHA-256:** \`${SHA256}\`
          - **Runtime:** $(python3 -c "import json; print(json.load(open('toolchain/runtime-lock.json'))['runtime_id'])")

          Built by ZABAWHEELS CI pipeline." \
            --prerelease \
            --target ${{ github.sha }} || \
          gh release upload "$TAG" "$WHEEL" --clobber

      - name: Commit index update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index/
          git diff --cached --quiet || git commit -m "Update index: ${{ inputs.package }} ${{ inputs.version }} (${{ inputs.abi }})"
          git push
