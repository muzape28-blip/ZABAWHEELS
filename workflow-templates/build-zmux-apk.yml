name: Build ZMUX APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "toolchain/runtime-lock.json"
      - ".github/workflows/build-zmux-apk.yml"
      - "workflow-templates/build-zmux-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "toolchain/runtime-lock.json"
      - ".github/workflows/build-zmux-apk.yml"
      - "workflow-templates/build-zmux-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zmux-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  P4A_COMMIT: 5c192d7b7308487c2d3e3fcae63deba3131e7cb2

jobs:
  apk:
    name: Universal ARMv7 + ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: app/requirements.lock

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git zip unzip tar curl autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev cmake ninja-build
          python -m pip install --upgrade pip==23.2.1
          python -m pip install buildozer==1.5.0 Cython==0.29.33 setuptools==68.2.2 wheel==0.41.2

      - name: Validate app source and tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m compileall -q main.py zmux tests
          python -m pytest -q

      - name: Verify pinned runtime contract
        run: |
          grep -q "p4a.commit = $P4A_COMMIT" buildozer.spec
          grep -q '^title = ZMUX$' buildozer.spec
          grep -q '^package.name = zmux$' buildozer.spec
          grep -q '^android.archs = armeabi-v7a, arm64-v8a$' buildozer.spec

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4.0.1
        with:
          accept-android-sdk-licenses: true

      - name: Make SDK manager available to Buildozer
        run: |
          CMDLINE_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d -print -quit)
          test -n "$CMDLINE_TOOLS_DIR"
          mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          ln -sf "$CMDLINE_TOOLS_DIR/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          ln -sf "$CMDLINE_TOOLS_DIR/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager" || true
          yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            app/.buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-zmux-${{ hashFiles('app/buildozer.spec', 'toolchain/runtime-lock.json') }}
          restore-keys: ${{ runner.os }}-zmux-

      - name: Build signed-by-debug-key universal APK
        env:
          SOURCE_DATE_EPOCH: "1785283200"
        run: buildozer -v android debug

      - name: Name and checksum APK
        id: artifact
        run: |
          mkdir -p artifacts
          APK=$(find bin -maxdepth 1 -name '*.apk' -type f -print -quit)
          test -n "$APK"
          cp "$APK" artifacts/zmux-1.0.0-universal-debug.apk
          sha256sum artifacts/zmux-1.0.0-universal-debug.apk > artifacts/SHA256SUMS
          python - <<'PY'
          import json, pathlib
          lock = json.loads(pathlib.Path('../toolchain/runtime-lock.json').read_text())
          pathlib.Path('artifacts/build-contract.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY
          echo "apk=$PWD/artifacts/zmux-1.0.0-universal-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload ZMUX APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: zmux
          path: app/artifacts/*
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest APK provenance
    if: github.event_name != 'pull_request'
    needs: apk
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write  # Signs provenance through GitHub's OIDC provider.
      attestations: write  # Publishes the generated provenance attestation.
    steps:
      - name: Download ZMUX APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: zmux
          path: app/artifacts

      - name: Attest APK provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: app/artifacts/zmux-1.0.0-universal-debug.apk
